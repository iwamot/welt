name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-python.yml@e30904fbba60ee0a2dde540df2403a90e59e3a5e # v8.17.0
    with:
      python-versions: '["3.12","3.13","3.14","3.15"]'
