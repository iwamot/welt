name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-python.yml@825e9b230f1a6230ab98fec77129a16634f8f589 # v8.23.0
    with:
      python-versions: '["3.12","3.13","3.14","3.15"]'
