name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-python.yml@7b091fa5fb18e6dc84145fa54fd45ff94e139cd0 # v8.18.0
    with:
      python-versions: '["3.12","3.13","3.14","3.15"]'
