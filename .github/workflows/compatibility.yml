name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-python.yml@866cf6089ddb88af6b479a14a4a78910b472b5f6 # v8.11.0
    with:
      python-versions: '["3.12","3.13","3.14","3.15"]'
