name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  draft:
    name: release-draft
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: write  # to create the draft GitHub Release
      checks: read  # to wait for required CI before tagging
      statuses: read  # to inspect required legacy commit statuses
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            auth.docker.io:443
            dhi.io:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: iwamot/actions/release-tag@36800ea9a4338d93a76da45a27230bce01c59269 # v2.16.1
        id: release-tag
        with:
          tag: ${{ inputs.tag || '' }}

      - uses: iwamot/actions/release-draft@36800ea9a4338d93a76da45a27230bce01c59269 # v2.16.1
        with:
          tag: ${{ steps.release-tag.outputs.tag }}

  lambda-zip:
    name: lambda-zip
    needs: draft
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # to attach assets to the draft GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            pypi.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.draft.outputs.tag }}
          persist-credentials: false

      - name: Get mise version from mise.toml
        id: mise-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('mise.toml','rb'))['min_version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ steps.mise-version.outputs.version }}
          install: false
          cache: false

      - name: Build Lambda release assets
        run: mise exec aqua:astral-sh/uv -- make lambda-zip

      - uses: iwamot/actions/release-upload@36800ea9a4338d93a76da45a27230bce01c59269 # v2.16.1
        with:
          tag: ${{ needs.draft.outputs.tag }}
          files: |
            dist/welt-lambda-*.zip
            dist/template.yaml
            dist/welt-lambda.json

  image:
    name: publish-ghcr
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: write  # to push images to GHCR
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            auth.docker.io:443
            dhi.io:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hardened Images
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: iwamot/actions/docker-build-digest@36800ea9a4338d93a76da45a27230bce01c59269 # v2.16.1
        with:
          tag: ${{ needs.draft.outputs.tag }}
          registry_image: ${{ env.REGISTRY_IMAGE }}
          platform: ${{ matrix.platform }}

  image-merge:
    name: merge-and-sign
    needs: [draft, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write  # to mint OIDC tokens for cosign and attest
      packages: write  # to push the merged manifest to GHCR
      attestations: write  # to write the provenance attestation
      artifact-metadata: write  # to record artifact metadata for the attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            auth.docker.io:443
            dhi.io:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: iwamot/actions/docker-merge-and-sign@36800ea9a4338d93a76da45a27230bce01c59269 # v2.16.1
        with:
          tag: ${{ needs.draft.outputs.tag }}
          registry_image: ${{ env.REGISTRY_IMAGE }}

  publish:
    name: release-publish
    needs: [draft, lambda-zip, image-merge]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions:
      contents: write  # to flip the draft GitHub Release to published
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            auth.docker.io:443
            dhi.io:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: iwamot/actions/release-publish@36800ea9a4338d93a76da45a27230bce01c59269 # v2.16.1
        with:
          tag: ${{ needs.draft.outputs.tag }}
