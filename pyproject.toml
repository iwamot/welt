# Dependency management with uv.
# Welt is a deployable Slack frontend, not a distributable package, so this file
# defines no build backend — it only pins dependencies and tool configuration.

[project]
name = "welt"
version = "0.0.0"
description = "Slack frontend for AI agents on Amazon Bedrock AgentCore Runtime."
# Floor matches the oldest AL2023-based AWS Lambda Python runtime (python3.12),
# so the Lambda entry point runs on every current-generation managed runtime.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Takashi Iwamoto", email = "hello@iwamot.com" }]
dependencies = [
    "slack-bolt==1.30.0",
    # Welt makes Slack Web API calls directly through AsyncWebClient, so it
    # depends on slack-sdk explicitly (not only transitively via slack-bolt).
    "slack-sdk==3.43.0",
    # Bolt's AsyncApp imports aiohttp at module load (its async web server).
    "aiohttp==3.14.3",
    # invoke_agent_runtime (AgentCore Runtime) is called through boto3.
    "boto3==1.43.81",
]

# The dev group is included by `uv sync` and `uv run` by default (and
# excluded from the container by `uv sync --no-dev`), so a plain
# `uv run main.py` works for local development.
[dependency-groups]
dev = [
    # botocore's login credential provider (`aws login` sessions) needs the
    # CRT; deployed runtimes authenticate with an IAM role instead.
    "awscrt==0.36.2",
    # Checks the payloads Welt builds against schema/request-payload.schema.json,
    # so the published contract cannot drift from what Welt sends.
    "jsonschema==4.26.0",
    "pip-licenses==5.5.5",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
exclude-newer = "1 day"

[tool.uv.audit]
# Check the locked packages against OSV malware advisories before any sync
# installs them, so a compromised release cannot run its install hooks here.
malware-check = true

[tool.ruff]
include = ["*.py", "app/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Reference: https://pydevtools.com/handbook/how-to/how-to-configure-recommended-ruff-defaults/
extend-select = [
    "F",    # Pyflakes rules
    "W",    # PyCodeStyle warnings
    # "E",    # PyCodeStyle errors
    "I",    # Sort imports properly
    "UP",   # Warn if certain things can changed due to newer Python versions
    "C4",   # Catch incorrect use of comprehensions, dict, list, etc
    "FA",   # Enforce from __future__ import annotations
    "ISC",  # Good use of string concatenation
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    # "SIM",  # Common simplification rules
    "TID",  # Some good import practices
    # "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "TD",   # Be diligent with TODO comments
    # "NPY",  # Some numpy-specific things
    # Not in the reference URL
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",  # Allow assert in tests (pytest standard practice)
]

[tool.ty.src]
include = [".", "app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["main", "lambda_function", "app"]
branch = true

[tool.coverage.report]
show_missing = true
