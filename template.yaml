AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Welt on AWS Lambda: the Slack Events API frontend for AgentCore agents.
  Deploy with the AWS SAM CLI (see docs/lambda.md).

Parameters:
  FunctionName:
    Type: String
    Default: welt
    # A fixed name lets the self-invoke policy below reference the function
    # without a circular dependency on the function resource itself.
    Description: Name of the Lambda function.
  SlackBotToken:
    Type: String
    NoEcho: true
    Description: Slack bot token (xoxb-...).
  SlackSigningSecret:
    Type: String
    NoEcho: true
    Description: Slack signing secret (Basic Information > Signing Secret).
  AgentArn:
    Type: String
    Default: ""
    Description: ARN of the Runtime or harness; leave empty to use the Gateway URL alone.

  AgentGatewayUrl:
    Type: String
    Default: ""
    Description: Optional IAM-authenticated Gateway target base URL in the agent region.
  GatewayArn:
    Type: String
    Default: ""
    Description: ARN of that Gateway, for the function's invocation permission.

Rules:
  AgentTarget:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Not: [Fn::Equals: [!Ref AgentArn, ""]]
            - Fn::Not: [Fn::Equals: [!Ref AgentGatewayUrl, ""]]
        AssertDescription: Set AgentArn or AgentGatewayUrl.
  GatewaySettings:
    Assertions:
      - Assert:
          Fn::Equals:
            - Fn::Equals: [!Ref AgentGatewayUrl, ""]
            - Fn::Equals: [!Ref GatewayArn, ""]
        AssertDescription: Set AgentGatewayUrl and GatewayArn together.

Conditions:
  UseGateway: !Not [!Equals [!Ref AgentGatewayUrl, ""]]
  UseAgentArn: !Not [!Equals [!Ref AgentArn, ""]]

Resources:
  WeltFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # The Makefile packages an explicit file list; SAM's built-in Python
      # builder would copy the whole repository instead.
      BuildMethod: makefile
    Properties:
      FunctionName: !Ref FunctionName
      Description: Slack frontend for AI agents on Amazon Bedrock AgentCore Runtime.
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.14
      # Graviton: the function spends its time waiting on the AgentCore stream,
      # so there is no compute difference — only the lower duration price.
      Architectures: [arm64]
      MemorySize: 512
      # Execution is bounded by Lambda's 15-minute cap; give replies all of it.
      Timeout: 900
      # Bolt re-invokes this function asynchronously to run the lazy listener.
      # Lambda retries a failed asynchronous invocation twice by default, which
      # would send the same turn to the agent again; a reply that failed or hit
      # the cap is not worth repeating.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      FunctionUrlConfig:
        # Slack requests are authenticated by signature verification with the
        # signing secret, not by the Function URL.
        AuthType: NONE
      Environment:
        Variables:
          SLACK_BOT_TOKEN: !Ref SlackBotToken
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          AGENT_ARN: !Ref AgentArn
          AGENT_GATEWAY_URL: !Ref AgentGatewayUrl
      Policies:
        - Statement:
            # Bolt acks each event within Slack's 3-second window and
            # re-invokes this same function to run the lazy listener.
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
            - !If
              - UseGateway
              - Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Ref GatewayArn
              - !Ref AWS::NoValue
            - !If
              - UseAgentArn
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  # Welt passes runtimeUserId, which needs the ForUser action.
                  - bedrock-agentcore:InvokeAgentRuntimeForUser
                  - bedrock-agentcore:InvokeHarness
                # Strip any endpoint suffix so the resource and all of its
                # endpoints receive the same permissions.
                Resource:
                  - !Join
                    - /
                    - - !Select [0, !Split ["/", !Ref AgentArn]]
                      - !Select [1, !Split ["/", !Ref AgentArn]]
                  - !Join
                    - /
                    - - !Select [0, !Split ["/", !Ref AgentArn]]
                      - !Select [1, !Split ["/", !Ref AgentArn]]
                      - "*"
              - !Ref AWS::NoValue

Outputs:
  FunctionUrl:
    Description: Slack Events API request URL for the app manifest.
    Value: !GetAtt WeltFunctionUrl.FunctionUrl
